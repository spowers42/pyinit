version: '3'

tasks:
  install-golangci-lint:
    desc: Install golangci-lint v2.12.2 (matches CI)
    cmd: brew install golangci-lint@2.12.2 || curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2

  build:
    desc: Build the pyinit binary
    cmd: go build -o pyinit .

  lint:
    desc: Run golangci-lint
    cmd: golangci-lint run ./...

  test:
    desc: Run tests
    cmd: go test ./...

  check:
    desc: Lint and test
    deps: [lint, test]

  demo-sync:
    desc: Fail if internal/tui changed without demo/
    cmd: scripts/check-demo-sync.sh

  install-hooks:
    desc: Install the git pre-commit hook (runs task check)
    cmd: ln -sf ../../scripts/pre-commit .git/hooks/pre-commit

  clean:
    desc: Remove built binary
    cmd: rm -f pyinit
