# The only release path: see docs/adr/0001-releases-only-via-dispatch-workflow.md.
# Run via `task release -- <patch|minor|major>`. Pushing a v* tag by hand does nothing.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]
      confirm_major:
        description: For major bumps, type the computed version (e.g. v1.0.0)
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    name: Check, tag, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Refuse unless on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run only from main (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          CONFIRM_MAJOR: ${{ inputs.confirm_major }}
        run: |
          next=$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' \
            | scripts/next-version.sh "$BUMP")
          echo "Next version: $next ($BUMP)"
          if [ "$BUMP" = "major" ] && [ "$CONFIRM_MAJOR" != "$next" ]; then
            echo "::error::Major release requires confirm_major=$next (got '$CONFIRM_MAJOR')."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Tag $next already exists."
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Check
        run: task check

      - name: Tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"

      # Publish in this workflow: tags pushed with GITHUB_TOKEN trigger no other workflows.
      - name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3 # keep in sync with GORELEASER_VERSION in Taskfile.yml
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
