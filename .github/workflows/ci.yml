name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - name: Build
        run: task build

      - name: Test
        run: task test

      - name: Demo in sync with TUI
        if: github.event_name == 'pull_request'
        run: scripts/check-demo-sync.sh origin/${{ github.base_ref }}

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
